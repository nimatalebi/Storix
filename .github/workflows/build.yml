name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Storix.sln

      - name: Build
        run: dotnet build Storix.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Storix.sln -c Release --no-build --verbosity normal

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    env:
      STORIX_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone

      - name: Test
        run: dotnet test tests/NT.Storix.IntegrationTests -c Release --verbosity normal
