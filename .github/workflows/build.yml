name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Storix.sln

      - name: Build
        run: dotnet build Storix.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Storix.sln -c Release --no-build --verbosity normal

      - name: UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/NT.Storix.WinForms.Tests/bin/Release/net10.0-windows/screenshots/
          if-no-files-found: ignore

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    env:
      STORIX_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone

      - name: Test
        run: dotnet test tests/NT.Storix.IntegrationTests -c Release --verbosity normal

      - name: Telegram relay (Cloudflare Worker) tests
        run: node --test tools/telegram-relay/worker.test.mjs

      - name: Linux agent package
        run: ./build/package-linux.sh 0.0.0-ci artifacts
