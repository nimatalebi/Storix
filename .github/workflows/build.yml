name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Storix.sln

      - name: Build
        run: dotnet build Storix.sln -c Release --no-restore

      - name: Test
        run: dotnet test Storix.sln -c Release --no-build --verbosity normal
