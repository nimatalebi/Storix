name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (without the leading v)
        required: true
        default: 0.1.0-preview
      publish:
        description: Create the tag v<version> on this commit and publish the GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          "value=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Storix.sln -c Release

      - name: Package
        shell: pwsh
        env:
          STORIX_SIGN_CERT: ${{ secrets.STORIX_SIGN_CERT }}
          STORIX_SIGN_PASSWORD: ${{ secrets.STORIX_SIGN_PASSWORD }}
        run: ./build/package.ps1 -Version ${{ steps.version.outputs.value }} -Output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: storix-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt

      - name: Release notes
        id: notes
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        run: |
          $notes = "docs/releases/${{ steps.version.outputs.tag }}.md"
          if (Test-Path $notes) { "path=$notes" >> $env:GITHUB_OUTPUT }

      - name: GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Storix ${{ steps.version.outputs.value }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt

  linux:
    # After the Windows job, so that one creates the release (with its notes) and this one only adds files.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"; else v="${{ inputs.version }}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Package
        run: ./build/package-linux.sh "${{ steps.version.outputs.value }}" artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: storix-${{ steps.version.outputs.value }}-linux
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS-linux.txt

      - name: GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS-linux.txt
